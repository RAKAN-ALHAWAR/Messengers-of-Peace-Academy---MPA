stages:
  - verify

# Bootstrap the same Flutter release used for the local regression suite.
# This job tests the client only and has no deploy step or service credentials.
flutter_checks:
  stage: verify
  image: ubuntu:24.04
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates curl git unzip xz-utils libglu1-mesa
    - git clone --depth 1 --branch 3.41.6 https://github.com/flutter/flutter.git /opt/flutter
    - test "$(git -C /opt/flutter rev-parse HEAD)" = "db50e20168db8fee486b9abf32fc912de3bc5b6a"
    - export PATH="/opt/flutter/bin:$PATH"
    - flutter config --no-analytics
    - flutter pub get
  script:
    # Existing informational deprecations remain visible; errors/warnings fail.
    - flutter analyze --no-pub --no-fatal-infos
    - flutter test --no-pub --reporter expanded
